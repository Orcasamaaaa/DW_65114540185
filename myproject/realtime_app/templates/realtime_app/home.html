<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Realtime ClickHouse Events</title>
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <script src="https://unpkg.com/htmx.org@1.9.2"></script>
</head>
<body>

    <h1>Realtime ClickHouse Event Count</h1>

    <div
        x-data="{ count: 0 }"
        x-init="(() => {
            const ws = new WebSocket('ws://' + window.location.host + '/ws/events/');

            ws.onopen = (event) => {
                console.log('WebSocket connection established.');
                ws.send(JSON.stringify({ 'request': 'initial_data' }));
            };

            ws.onmessage = event => {
                const data = JSON.parse(event.data);
                if (data.count !== undefined) {
                    count = data.count;
                    console.log('Received count:', data.count);
                } else if (data.error) {
                    console.error('WebSocket error:', data.error);
                }
            };

            ws.onclose = (event) => {
                console.log('WebSocket connection closed:', event);
            };

            ws.onerror = (error) => {
                console.error('WebSocket error occurred:', error);
            };

            setInterval(() => {
                 if (ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({ 'request': 'update_data' }));
                 }
            }, 5000);
        })()"
    >
        <p>จำนวนเหตุการณ์ล่าสุด: <span x-text="count">0</span></p>
    </div>

</body>
</html>
